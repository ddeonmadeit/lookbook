<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!--
      Content Security Policy: scripts may ONLY come from this site itself —
      no third-party or injected scripts (i.e. no ads) can ever execute.
      Styles/fonts: self + Google Fonts. Data: self + Supabase (+ Shopify's
      API/CDN for the optional Shopify mode). upgrade-insecure-requests turns
      any stray http:// subresource into https://.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co https://*.myshopify.com https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; upgrade-insecure-requests"
    />
    <title>Knots</title>
    <meta name="description" content="Natural Streetwear">
    <meta name="author" content="KNOTS" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KNOTS" />
    <meta name="theme-color" content="#0f0e0d" />
    <!-- The PWA plugin injects a base-aware <link rel="manifest">, so we don't hardcode one here. -->

    <!-- Warm up third-party origins before they're needed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://yutmjcyqfxekooqplcqb.supabase.co" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    />
